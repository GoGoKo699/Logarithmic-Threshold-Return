name: Research verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up the reference Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.5"
      - name: Install numerical dependencies
        run: python -m pip install -r requirements.txt
      - name: Test verification infrastructure
        run: python tools/test_verify.py
      - name: Check the predecessor algebra separately
        run: python tools/test_predecessor.py
      - name: Check the operational contract separately
        run: python tools/test_operational_contract.py --output operational-evidence/REPORT.json
      - name: Check microscopic model residuals separately
        run: python tools/test_model_residual.py --output model-residual-evidence/REPORT.json
      - name: Check preserved inputs and document links
        run: python verify.py --integrity-only
      - name: Run every scientific suite and retain comparisons
        run: python verify.py --output-dir verification-artifacts
      - name: Confirm preserved source was not rewritten
        if: always()
        run: git diff --exit-code -- tests research archive provenance/IMPORT_MAP.json provenance/SUITES.json
      - name: Preserve the tracked source snapshot
        if: always()
        run: git archive --format=zip --output=tracked-source.zip HEAD
      - name: Upload raw evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-evidence
          path: |
            verification-artifacts/
            operational-evidence/
            model-residual-evidence/
            tracked-source.zip
          if-no-files-found: warn
          retention-days: 14
